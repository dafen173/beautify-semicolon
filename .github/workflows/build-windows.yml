name: Build Windows

on:
  push:
    branches: [mvp-ubuntu]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure all files are checked out

      # 1. Verify repository structure
      - name: Verify repository structure
        run: |
          echo "Repository root contents:"
          ls -la
          echo "src-tauri contents:"
          ls -la src-tauri/
          echo "Icons directory contents:"
          ls -la src-tauri/icons/

      # 2. Verify icons exist (with better error messages)
      - name: Check icon files
        run: |
          if [ ! -f src-tauri/icons/32x32.png ]; then echo "ERROR: 32x32.png missing"; exit 1; fi
          if [ ! -f src-tauri/icons/128x128.png ]; then echo "ERROR: 128x128.png missing"; exit 1; fi
          if [ ! -f src-tauri/icons/128x128@2x.png ]; then echo "ERROR: 128x128@2x.png missing"; exit 1; fi
          if [ ! -f src-tauri/icons/icon.icns ]; then echo "ERROR: icon.icns missing"; exit 1; fi
          if [ ! -f src-tauri/icons/icon.ico ]; then echo "ERROR: icon.ico missing"; exit 1; fi
          echo "All icon files present"

      # 3. Install system dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libusb-1.0-0-dev \
            pkg-config \
            libssl-dev \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      # 4. Setup Rust toolchain
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true
          components: rust-src, rustfmt, clippy

      # 5. Configure mingw linker
      - name: Setup mingw linker
        run: |
          mkdir -p ~/.cargo
          echo '[target.x86_64-pc-windows-msvc]' >> ~/.cargo/config.toml
          echo 'linker = "x86_64-w64-mingw32-gcc"' >> ~/.cargo/config.toml
          echo 'ar = "x86_64-w64-mingw32-gcc-ar"' >> ~/.cargo/config.toml

      # 6. Setup Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'yarn'

      # 7. Install project dependencies
      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          cd src-tauri
          cargo generate-lockfile
          cd ..

      # 8. Build with maximum verbosity
      - name: Build application
        env:
          CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG: true
          RUST_BACKTRACE: full
        run: |
          echo "Building from directory: $(pwd)"
          ls -la src-tauri/icons/
          
          cd src-tauri
          cargo build --release --target x86_64-pc-windows-msvc --verbose
          cd ..
          
          yarn tauri build --target x86_64-pc-windows-msvc --verbose

      # 9. Upload artifacts
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 5