name: Build Windows

on:
  push:
    branches: [mvp-ubuntu]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Verify icons exist
      - name: Check icon files
        run: |
          ls -la src-tauri/icons/
          [ -f src-tauri/icons/32x32.png ] || exit 1
          [ -f src-tauri/icons/128x128.png ] || exit 1
          [ -f src-tauri/icons/128x128@2x.png ] || exit 1
          [ -f src-tauri/icons/icon.icns ] || exit 1
          [ -f src-tauri/icons/icon.ico ] || exit 1

      # 2. Setup Rust toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, rustfmt, clippy

      # 3. Setup Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      # 4. Clean and install dependencies
      - name: Install dependencies
        run: |
          cd src-tauri
          cargo clean
          cd ..
          npm ci
          cd src-tauri
          cargo update
          cd ..

      # 5. Build with verbose output
      - name: Build application
        env:
          CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG: "true"
        run: |
          npm run tauri -- build --verbose

      # 6. Upload artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 5
