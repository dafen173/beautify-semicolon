name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Generate icons if missing
      - name: Generate placeholder icons
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p src-tauri/icons
          convert -size 32x32 xc:white src-tauri/icons/32x32.png
          convert -size 128x128 xc:white src-tauri/icons/128x128.png
          convert -size 256x256 xc:white src-tauri/icons/128x128@2x.png
          convert -size 32x32 xc:white src-tauri/icons/icon.icns
          convert -size 32x32 xc:white src-tauri/icons/icon.ico

      # 2. Install system dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libusb-1.0-0-dev \
            pkg-config \
            libssl-dev \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev

      # 3. Setup Rust
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true
          components: rust-src, rustfmt, clippy

      # 4. Configure linker
      - name: Setup mingw linker
        run: |
          mkdir -p ~/.cargo
          echo '[target.x86_64-pc-windows-msvc]' >> ~/.cargo/config.toml
          echo 'linker = "x86_64-w64-mingw32-gcc"' >> ~/.cargo/config.toml
          echo 'ar = "x86_64-w64-mingw32-gcc-ar"' >> ~/.cargo/config.toml

      # 5. Install Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'yarn'

      # 6. Debug environment
      - name: Debug Info
        run: |
          ls -la src-tauri/
          rustc --version
          cargo --version
          node --version
          yarn --version

      # 7. Build
      - name: Build application
        run: |
          cd src-tauri
          RUST_BACKTRACE=full cargo build --release --target x86_64-pc-windows-msvc --verbose
          cd ..
          yarn tauri build --target x86_64-pc-windows-msvc --verbose

      # 8. Upload artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi