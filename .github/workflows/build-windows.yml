name: Build Windows

on:
  push:
    branches: [mvp-ubuntu]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Generate icons if missing
      - name: Generate placeholder icons
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p src-tauri/icons
          convert -size 32x32 xc:white src-tauri/icons/32x32.png || true
          convert -size 128x128 xc:white src-tauri/icons/128x128.png || true
          convert -size 256x256 xc:white src-tauri/icons/128x128@2x.png || true
          convert -size 32x32 xc:white src-tauri/icons/icon.icns || true
          convert -size 32x32 xc:white src-tauri/icons/icon.ico || true

      # 2. Install system deps
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libusb-1.0-0-dev \
            pkg-config \
            libssl-dev \
            mingw-w64 \
            gcc-mingw-w64-x86-64

      # 3. Setup Rust
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      # 4. Configure linker
      - name: Setup mingw linker
        run: |
          mkdir -p ~/.cargo
          echo '[target.x86_64-pc-windows-msvc]' >> ~/.cargo/config.toml
          echo 'linker = "x86_64-w64-mingw32-gcc"' >> ~/.cargo/config.toml

      # 5. Install Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'yarn'

      # 6. Build
      - name: Build application
        run: |
          yarn install
          yarn tauri build --target x86_64-pc-windows-msvc

      # 7. Upload artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi