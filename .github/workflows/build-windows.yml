name: Build Windows

on:
  push:
    branches: [mvp-ubuntu]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Verify icons exist (optional debug step)
      - name: Check icon files
        run: |
          ls -la src-tauri/icons/
          [ -f src-tauri/icons/32x32.png ] || exit 1
          [ -f src-tauri/icons/128x128.png ] || exit 1
          [ -f src-tauri/icons/128x128@2x.png ] || exit 1
          [ -f src-tauri/icons/icon.icns ] || exit 1
          [ -f src-tauri/icons/icon.ico ] || exit 1

      # 2. Install system dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libusb-1.0-0-dev \
            pkg-config \
            libssl-dev \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev

      # 3. Setup Rust toolchain
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true
          components: rust-src, rustfmt, clippy

      # 4. Configure mingw linker
      - name: Setup mingw linker
        run: |
          mkdir -p ~/.cargo
          echo '[target.x86_64-pc-windows-msvc]' >> ~/.cargo/config.toml
          echo 'linker = "x86_64-w64-mingw32-gcc"' >> ~/.cargo/config.toml
          echo 'ar = "x86_64-w64-mingw32-gcc-ar"' >> ~/.cargo/config.toml

      # 5. Setup Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'yarn'

      # 6. Install project dependencies
      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          cd src-tauri
          cargo generate-lockfile
          cd ..

      # 7. Build with verbose output
      - name: Build application
        run: |
          cd src-tauri
          RUST_BACKTRACE=full cargo build --release --target x86_64-pc-windows-msvc --verbose
          cd ..
          yarn tauri build --target x86_64-pc-windows-msvc --verbose

      # 8. Upload artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 5