name: Build Windows

on:
  push:
    branches: [ main, mvp-ubuntu ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install system dependencies
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libusb-1.0-0-dev \
            pkg-config \
            libssl-dev \
            mingw-w64 \
            gcc-mingw-w64-x86-64

      # 2. Install Rust + Windows target
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true
          components: rust-src, rustfmt, clippy

      # 3. Configure linker
      - name: Setup mingw linker
        run: |
          echo '[target.x86_64-pc-windows-msvc]' >> ~/.cargo/config.toml
          echo 'linker = "x86_64-w64-mingw32-gcc"' >> ~/.cargo/config.toml
          echo 'ar = "x86_64-w64-mingw32-gcc-ar"' >> ~/.cargo/config.toml

      # 4. Install Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'yarn'

      # 5. Install project dependencies
      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          cd src-tauri
          cargo generate-lockfile
          cd ..

      # 6. Build Tauri app
      - name: Build application
        run: |
          yarn tauri build --target x86_64-pc-windows-msvc
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: full

      # 7. Upload artifacts
      - uses: actions/upload-artifact@v3
        if: success()
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 5