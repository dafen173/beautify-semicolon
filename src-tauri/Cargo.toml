[package]
name = "my-app"
version = "0.1.0"
description = "A Tauri App for Optoma Projector Control"
authors = ["you"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.5.0" }

[dependencies]
tauri = { version = "2.5.0" }
tauri-plugin-opener = "2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.2", default-features = false }
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"

[package.metadata.tauri.bundle]
identifier = "com.myapp.projector"
copyright = "© 2023 My App"
category = "Utility"
icons = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico"
]