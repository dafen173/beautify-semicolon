[package]
name = "my-app"
version = "0.1.0"
description = "A Tauri App for Optoma Projector Control"
authors = ["you"]
edition = "2021"
license = "MIT"
repository = ""

[lib]
name = "my_app_lib"
crate-type = ["cdylib", "rlib"]  # Removed staticlib as it's not needed for Tauri

[build-dependencies]
tauri-build = { version = "2.2.0" }

[dependencies]
tauri = { version = "2.5.1", features = ["shell-open"] }
tauri-plugin-opener = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.2", default-features = false }
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"  # For better error handling

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[package.metadata.tauri]
allowlist = { 
    all = false,
    shell = { 
        open = true,
        scope = [{ name = "http://localhost*" }]
    }
}

[package.metadata.tauri.bundle]
identifier = "com.myapp.projector"
copyright = "© 2023 My App"
category = "Utility"
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico"
]
resources = ["icons"]